name: Publish Quicken UI family releases

on:
  push:
    branches: [main]
    paths:
      - .github/workflows/publish-ui-family.yml

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Create GitHub releases
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          publish() {
            tag="$1"
            title="$2"
            gh release view "$tag" >/dev/null 2>&1 ||
              gh release create "$tag" \
                --verify-tag \
                --title "$title" \
                --generate-notes
          }
          publish native/v0.1.0 "Quicken Native v0.1.0"
          publish tui/v0.1.0 "Quicken TUI v0.1.0"
          publish desktop/v0.1.0 "Quicken Desktop v0.1.0"
          publish mobile/v0.1.0 "Quicken Mobile v0.1.0"
          publish mobile/v0.1.1 "Quicken Mobile v0.1.1"
          publish build/v0.1.0 "Quicken Build v0.1.0"
          publish build/v0.2.0 "Quicken Build v0.2.0"
          publish v0.8.0 "Quicken Web v0.8.0"
