version: '3'

vars:
  QUICKEN_BUILD: go run goforge.dev/quicken/build/cmd/quicken-build@v0.2.0

tasks:
  default:
    cmds:
      - task: doctor

  doctor:
    desc: Check every configured Quicken target toolchain
    cmds:
      - '{{.QUICKEN_BUILD}} doctor all'

  doctor:web:
    cmds:
      - '{{.QUICKEN_BUILD}} doctor web'

  doctor:desktop:
    cmds:
      - '{{.QUICKEN_BUILD}} doctor desktop'

  doctor:ios:
    cmds:
      - '{{.QUICKEN_BUILD}} doctor ios'

  doctor:android:
    cmds:
      - '{{.QUICKEN_BUILD}} doctor android'

  build:web:
    cmds:
      - '{{.QUICKEN_BUILD}} build web'

  build:tui:
    cmds:
      - '{{.QUICKEN_BUILD}} build tui'

  build:desktop:
    cmds:
      - '{{.QUICKEN_BUILD}} build desktop'

  build:desktop:windows:amd64:
    cmds:
      - '{{.QUICKEN_BUILD}} build desktop-windows-amd64'

  build:desktop:windows:arm64:
    cmds:
      - '{{.QUICKEN_BUILD}} build desktop-windows-arm64'

  build:desktop:macos:amd64:
    cmds:
      - '{{.QUICKEN_BUILD}} build desktop-darwin-amd64'

  build:desktop:macos:arm64:
    cmds:
      - '{{.QUICKEN_BUILD}} build desktop-darwin-arm64'

  build:desktop:linux:amd64:
    cmds:
      - '{{.QUICKEN_BUILD}} build desktop-linux-amd64'

  build:desktop:linux:arm64:
    cmds:
      - '{{.QUICKEN_BUILD}} build desktop-linux-arm64'

  build:ios:
    cmds:
      - '{{.QUICKEN_BUILD}} build ios-simulator'

  build:ios:device:
    cmds:
      - '{{.QUICKEN_BUILD}} build ios-device'

  build:android:
    cmds:
      - '{{.QUICKEN_BUILD}} build android-emulator'

  build:available:
    desc: Build targets supported by the current host toolchain
    cmds:
      - task: build:web
      - task: build:tui
      - task: build:desktop
      - task: build:ios

  run:web:
    cmds:
      - '{{.QUICKEN_BUILD}} run web'

  run:tui:
    cmds:
      - '{{.QUICKEN_BUILD}} run tui'

  run:desktop:
    cmds:
      - '{{.QUICKEN_BUILD}} run desktop'

  run:ios:
    cmds:
      - '{{.QUICKEN_BUILD}} run ios-simulator'

  run:ios:device:
    cmds:
      - '{{.QUICKEN_BUILD}} -device {{.DEVICE}} run ios-device'

  run:android:
    cmds:
      - '{{.QUICKEN_BUILD}} run android-emulator'
